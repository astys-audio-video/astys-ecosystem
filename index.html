<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astys Audio Video Pvt Ltd</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --card-hover-border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-blue-bg: #eff6ff;
            --accent-purple: #7c3aed;
            --accent-purple-bg: #f5f3ff;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .header {
            margin-bottom: 2.5rem;
            padding: 0 0.5rem;
        }

        .header h1 {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .header p {
            color: var(--text-muted);
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            font-weight: 400;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            padding: 0;
        }

        @media (min-width: 640px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }
            .header {
                margin-bottom: 3.5rem;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .card:hover, .card:focus-visible {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--card-hover-border);
            outline: none;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            transition: transform 0.25s ease;
        }

        .exam-card .icon-wrapper {
            background: var(--accent-blue-bg);
            color: var(--accent-blue);
        }

        .policy-card .icon-wrapper {
            background: var(--accent-purple-bg);
            color: var(--accent-purple);
        }

        .card:hover .icon-wrapper {
            transform: scale(1.08);
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.925rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.925rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            width: 100%;
            transition: all 0.2s ease;
        }

        .exam-card .card-button {
            background-color: var(--accent-blue);
            color: #ffffff;
        }

        .exam-card:hover .card-button {
            background-color: #1d4ed8;
        }

        .policy-card .card-button {
            background-color: var(--accent-purple);
            color: #ffffff;
        }

        .policy-card:hover .card-button {
            background-color: #6d28d9;
        }

        .card-button svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }

        .card:hover .card-button svg {
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Astys Audio Video Pvt Ltd</h1>
            <p>Select a portal to continue</p>
        </header>

        <main class="cards-grid">
            <!-- Exam Center Card -->
            <a href="https://test.astys.space/" class="card exam-card" target="_blank" rel="noopener noreferrer">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-5.25 6.557c0 1.5.347 2.92.973 4.195" />
                    </svg>
                </div>
                <h2 class="card-title">Exam Center</h2>
                <p class="card-description">Access examination portals and assessment modules.</p>
                <div class="card-button">
                    <span>Visit Exam Center</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                </div>
            </a>

            <!-- Policy Card -->
            <a href="https://policy.astys.space/" class="card policy-card" target="_blank" rel="noopener noreferrer">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751A11.959 11.959 0 0112 2.714z" />
                    </svg>
                </div>
                <h2 class="card-title">Policy</h2>
                <p class="card-description">View official terms, privacy policy, and compliance documents.</p>
                <div class="card-button">
                    <span>View Policy</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                </div>
            </a>
        </main>
    </div>
</body>
</html>
